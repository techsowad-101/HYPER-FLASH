
name: Build HYPER FLASH APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -n "$SETTINGS" ]; then
            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          else
            echo "Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HYPER-FLASH-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
